# 流萤动态博客 Nginx 反向代理示例（Linux）
# 部署步骤：
#   1. 修改 server_name 与证书路径为实际域名
#   2. sudo cp deploy/linux/nginx-firefly.conf /etc/nginx/conf.d/firefly.conf
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. HTTPS 证书可用 certbot 自动签发：sudo certbot --nginx -d blog.example.com
server {
    listen 80;
    server_name blog.example.com;

    # 上传接口单文件上限 10MB，这里预留表单开销
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # 后台登录接口禁止被搜索引擎抓取（正式环境建议保留 robots 头）
    location /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
