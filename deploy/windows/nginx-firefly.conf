# 流萤动态博客 Nginx 反向代理示例（Windows Server）
# 说明：Nginx 官方 Windows 版为测试版本，仅建议作为反向代理使用；
#       若使用 IIS，请安装 ARR + URL Rewrite 后按下述等价规则反向代理到 127.0.0.1:3000。
# 部署步骤：
#   1. 修改 server_name 与证书路径为实际域名
#   2. 将本文件内容并入 conf/nginx.conf 的 http {} 段，或放入 conf/conf.d/ 并在 nginx.conf 中 include
#   3. nginx.exe -t && nginx.exe -s reload
server {
    listen 80;
    server_name blog.example.com;

    # 上传接口单文件上限 10MB，这里预留表单开销
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    location /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
